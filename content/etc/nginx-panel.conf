server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name www.liangzi.icu liangzi.icu 50.114.5.99 _;
  client_max_body_size 200m;

  location /assets/ {
    root /opt/facebook/public;
    add_header Cache-Control "public, max-age=60, must-revalidate";
  }
  location = /favicon.svg { root /opt/facebook/public; }
  location = /assets/inject.js {
    alias /opt/facebook/public/assets/inject.js;
    default_type application/javascript;
    add_header Cache-Control "no-store";
  }

  location = /g {
    alias /var/www/html/wenan.html;
    default_type text/html;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header CDN-Cache-Control "no-store";
    add_header Pragma "no-cache";
  }
  location = /wenan {
    alias /var/www/html/wenan.html;
    default_type text/html;
    add_header Cache-Control "no-store";
  }
  location = /copy {
    alias /var/www/html/copy.html;
    default_type text/html;
    add_header Cache-Control "no-store";
  }


  location /lib/ {
    proxy_pass http://127.0.0.1:8088;
    proxy_set_header Host $host;
    add_header Access-Control-Allow-Origin *;
  }


  location = /ku {
    root /var/www/html;
    try_files /ku.html =404;
    add_header Cache-Control "no-store";
  }
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
    proxy_buffering off;
    sub_filter '</head>' '<script src="/assets/inject.js"></script></head>';
    sub_filter_once on;
  }
}
