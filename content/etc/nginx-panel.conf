server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name www.liangzi.icu liangzi.icu 50.114.5.99 _;
  client_max_body_size 200m;

  # Old panel (node :3000, /opt/facebook) removed 2026-11-26. Only the /var/www/html repo pages remain.
  location = / { return 307 /tiktok; }

  location = /g {
    alias /var/www/html/wenan.html;
    default_type text/html;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header CDN-Cache-Control "no-store";
    add_header Pragma "no-cache";
  }
  location = /wenan {
    alias /var/www/html/wenan.html;
    default_type text/html;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }
  location = /copy {
    alias /var/www/html/copy.html;
    default_type text/html;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  location /lib/ {
    proxy_pass http://127.0.0.1:8088;
    proxy_set_header Host $host;
    add_header Access-Control-Allow-Origin *;
  }

  location = /win { alias /var/www/html/win.html; default_type text/html; add_header Cache-Control "no-store, no-cache, must-revalidate"; }
  location = /ku {
    root /var/www/html;
    try_files /ku.html =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  location = /tiktok { alias /var/www/html/tiktok.html; default_type text/html; add_header Cache-Control "no-store, no-cache, must-revalidate"; }
  location = /facebook { alias /var/www/html/facebook.html; default_type text/html; add_header Cache-Control "no-store, no-cache, must-revalidate"; }
  location /data-api/ { proxy_pass http://127.0.0.1:8089/; }

  location / { return 404; }
}
